name: CI

"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: uv run pytest -q --tb=short

      - name: Check install.sh syntax
        if: runner.os != 'Windows'
        run: bash -n install.sh
      - name: Check install.ps1 syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }

  build:
    name: Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            mcp_exe: "dist/Talent Search.app/Contents/MacOS/Talent Search"
          - os: windows-latest
            mcp_exe: "dist/Talent Search/talent-search-mcp.exe"
          - os: ubuntu-latest
            mcp_exe: "dist/Talent Search/talent-search"
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: uv run pyinstaller packaging/talent-search.spec --noconfirm

      - name: Sign the Mac app (ad hoc) so the signed bundle is what gets tested
        if: runner.os == 'macOS'
        run: codesign --force --deep -s - "dist/Talent Search.app"

      - name: Smoke test the MCP server inside the build
        run: uv run python packaging/smoke_mcp.py "${{ matrix.mcp_exe }}"
        shell: bash

      - name: Check one-click connect from the build
        run: uv run python packaging/check_connect.py "${{ matrix.mcp_exe }}"
        shell: bash

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist && ditto -c -k --keepParent "Talent Search.app" ../TalentSearch-mac.zip
          # Disk image: the app plus an Applications shortcut to drag it onto.
          mkdir -p ../dmg-staging && cd ../dmg-staging
          cp -R "../dist/Talent Search.app" .
          ln -s /Applications Applications
          cd ..
          hdiutil create -volname "Talent Search" -srcfolder dmg-staging -ov -format UDZO TalentSearch-mac.dmg
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist\Talent Search" -DestinationPath TalentSearch-windows.zip
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf TalentSearch-linux.tar.gz -C dist "Talent Search"

      - name: Test the install script against this build (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/rel" "$RUNNER_TEMP/inst"
          cp TalentSearch-mac.zip "$RUNNER_TEMP/rel/"
          (cd "$RUNNER_TEMP/rel" && shasum -a 256 TalentSearch-mac.zip > SHA256SUMS.txt)
          TALENT_INSTALL_FROM="$RUNNER_TEMP/rel" TALENT_INSTALL_DIR="$RUNNER_TEMP/inst" sh install.sh --no-open
          test -x "$RUNNER_TEMP/inst/Talent Search.app/Contents/MacOS/Talent Search"
          uv run python packaging/smoke_mcp.py "$RUNNER_TEMP/inst/Talent Search.app/Contents/MacOS/Talent Search"
      - name: Test the install script against this build (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/rel" "$RUNNER_TEMP/inst"
          cp TalentSearch-linux.tar.gz "$RUNNER_TEMP/rel/"
          (cd "$RUNNER_TEMP/rel" && sha256sum TalentSearch-linux.tar.gz > SHA256SUMS.txt)
          TALENT_INSTALL_FROM="$RUNNER_TEMP/rel" TALENT_INSTALL_DIR="$RUNNER_TEMP/inst" sh install.sh --no-open
          test -x "$RUNNER_TEMP/inst/Talent Search/talent-search"
          uv run python packaging/smoke_mcp.py "$RUNNER_TEMP/inst/Talent Search/talent-search"
      - name: Test the install script against this build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rel = Join-Path $env:RUNNER_TEMP 'rel'
          $inst = Join-Path $env:RUNNER_TEMP 'inst'
          New-Item -ItemType Directory -Path $rel -Force | Out-Null
          Copy-Item TalentSearch-windows.zip $rel
          $hash = (Get-FileHash -Algorithm SHA256 (Join-Path $rel 'TalentSearch-windows.zip')).Hash.ToLower()
          Set-Content -Path (Join-Path $rel 'SHA256SUMS.txt') -Value "$hash  TalentSearch-windows.zip" -Encoding ascii
          $env:TALENT_INSTALL_FROM = $rel
          $env:TALENT_INSTALL_DIR = $inst
          & .\install.ps1 -NoOpen
          if (-not (Test-Path (Join-Path $inst 'talent-search-mcp.exe'))) { throw 'installed talent-search-mcp.exe is missing' }
          uv run python packaging/smoke_mcp.py (Join-Path $inst 'talent-search-mcp.exe')

      - uses: actions/upload-artifact@v4
        with:
          name: TalentSearch-${{ runner.os }}
          path: |
            TalentSearch-*.zip
            TalentSearch-*.dmg
            TalentSearch-*.tar.gz

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the version in pyproject.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$tag" != "$ver" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${ver}" >&2
            exit 1
          fi
      - name: Write release notes from CHANGELOG.md
        run: python3 packaging/release_notes.py "${GITHUB_REF_NAME}" > release_notes.md
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Write SHA256SUMS.txt
        run: |
          cd release-files
          sha256sum TalentSearch-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: release-files/*
