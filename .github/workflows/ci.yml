name: CI

"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: uv run pytest -q --tb=short

  build:
    name: Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            mcp_exe: "dist/Talent Search.app/Contents/MacOS/Talent Search"
          - os: windows-latest
            mcp_exe: "dist/Talent Search/talent-search-mcp.exe"
          - os: ubuntu-latest
            mcp_exe: "dist/Talent Search/talent-search"
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: uv run pyinstaller packaging/talent-search.spec --noconfirm

      - name: Sign the Mac app (ad hoc) so the signed bundle is what gets tested
        if: runner.os == 'macOS'
        run: codesign --force --deep -s - "dist/Talent Search.app"

      - name: Smoke test the MCP server inside the build
        run: uv run python packaging/smoke_mcp.py "${{ matrix.mcp_exe }}"
        shell: bash

      - name: Check one-click connect from the build
        run: uv run python packaging/check_connect.py "${{ matrix.mcp_exe }}"
        shell: bash

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist && ditto -c -k --keepParent "Talent Search.app" ../TalentSearch-mac.zip
          # Disk image: the app plus an Applications shortcut to drag it onto.
          mkdir -p ../dmg-staging && cd ../dmg-staging
          cp -R "../dist/Talent Search.app" .
          ln -s /Applications Applications
          cd ..
          hdiutil create -volname "Talent Search" -srcfolder dmg-staging -ov -format UDZO TalentSearch-mac.dmg
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist\Talent Search" -DestinationPath TalentSearch-windows.zip
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf TalentSearch-linux.tar.gz -C dist "Talent Search"

      - uses: actions/upload-artifact@v4
        with:
          name: TalentSearch-${{ runner.os }}
          path: |
            TalentSearch-*.zip
            TalentSearch-*.dmg
            TalentSearch-*.tar.gz

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the version in pyproject.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$tag" != "$ver" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${ver}" >&2
            exit 1
          fi
      - name: Write release notes from CHANGELOG.md
        run: python3 packaging/release_notes.py "${GITHUB_REF_NAME}" > release_notes.md
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Write SHA256SUMS.txt
        run: |
          cd release-files
          sha256sum TalentSearch-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: release-files/*
