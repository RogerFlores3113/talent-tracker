name: CI

"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: uv run pytest -q --tb=short

  build:
    name: Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            mcp_exe: "dist/Talent Search.app/Contents/MacOS/Talent Search"
          - os: windows-latest
            mcp_exe: "dist/Talent Search/talent-search-mcp.exe"
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: uv run pyinstaller packaging/talent-search.spec --noconfirm

      - name: Smoke test the MCP server inside the build
        run: uv run python packaging/smoke_mcp.py "${{ matrix.mcp_exe }}"
        shell: bash

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep -s - "dist/Talent Search.app"
          cd dist && ditto -c -k --keepParent "Talent Search.app" ../TalentSearch-mac.zip
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist\Talent Search" -DestinationPath TalentSearch-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TalentSearch-${{ runner.os }}
          path: TalentSearch-*.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TalentSearch-*.zip
