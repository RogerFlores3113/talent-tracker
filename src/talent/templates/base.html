<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Talent Search{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Talent Search</a>
    <nav>
      <a href="/" class="{{ 'on' if request.url.path == '/' }}">Candidates</a>
      <a href="/candidates/new">Add candidate</a>
      <a href="/connect" class="{{ 'on' if request.url.path == '/connect' }}">Connect AI</a>
    </nav>
  </header>
  <main>{% block body %}{% endblock %}</main>
  <footer class="foot">Your data stays on this computer.</footer>
</body>
</html>
